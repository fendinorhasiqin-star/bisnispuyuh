<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d6737"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PuyuhKu"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Masuk — PuyuhKu</title>
<style>
:root{--green:#1d6737;--ink:#1d3024;--muted:#6b7a6f;--bg:#f2f6f1}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.hero{background:linear-gradient(145deg,#1d6737,#31934c);color:#fff;padding:calc(48px + env(safe-area-inset-top)) 24px 70px;border-radius:0 0 30px 30px;text-align:center}
.hero .logo{font-size:56px;line-height:1}.hero h1{margin:10px 0 6px;font-size:26px;letter-spacing:-.5px}.hero p{margin:0;opacity:.9;font-size:14px}
.box{width:100%;max-width:400px;margin:-40px auto 0;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid #e4ebe3;border-radius:20px;padding:22px;box-shadow:0 8px 24px #20312612}
.card h2{margin:0 0 4px;font-size:18px}.card p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}
button{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #d5ddd3;border-radius:14px;padding:14px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.g{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#4285f4;color:#fff;font-weight:800;font-size:14px}
.err{margin-top:12px;padding:10px;border-radius:10px;background:#fae9e7;color:#9e332c;font-size:12px;line-height:1.5}.err:empty{display:none}
.back{display:block;text-align:center;margin-top:16px;color:var(--green);font-weight:700;font-size:13px;text-decoration:none}
</style></head><body>
<div class="hero"><div class="logo">🐦</div><h1>PuyuhKu</h1><p>Keuangan peternakan puyuh</p></div>
<div class="box"><div class="card"><h2>Masuk</h2><p>Gunakan akun Google Anda. Data tersimpan di akun dan bisa dibuka dari HP mana pun.</p><button id="btn" type="button"><span class="g">G</span>Masuk dengan Google</button><div class="err" id="err"></div></div><a class="back" id="back" href="index.html">‹ Kembali ke beranda</a></div>
<script type="module">
import {auth,configured,onAuthStateChanged,signInWithPopup,signInWithRedirect,getRedirectResult,GoogleAuthProvider} from "./firebase.js";
const btn=document.getElementById("btn"),err=document.getElementById("err");
if(!configured){err.textContent="Konfigurasi Firebase belum diisi. Buka firebase.js dan isi nilai firebaseConfig.";btn.disabled=true}
else{
 onAuthStateChanged(auth,u=>{if(u)location.replace("aplikasi.html")});
 getRedirectResult(auth).catch(e=>{err.textContent="Gagal masuk: "+e.code});
 btn.onclick=async()=>{err.textContent="";btn.disabled=true;const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(auth,p)}
  catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){await signInWithRedirect(auth,p);return}
   if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")err.textContent="Gagal masuk: "+e.code;btn.disabled=false}}
}
</script><script>if(matchMedia("(display-mode: standalone)").matches||navigator.standalone){var b=document.getElementById("back");if(b)b.style.display="none"}</script><script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</body></html>
