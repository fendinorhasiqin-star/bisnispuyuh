<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk — PuyuhKu</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf6ee;color:#1c2b22;font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.box{width:min(380px,92vw);background:#fff;border:1px solid #eee7d8;border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 6px 20px #78591e14}
h1{font-size:22px;margin:8px 0 4px}p{color:#718075;font-size:13px;margin:0 0 20px}
button{width:100%;border:0;border-radius:14px;padding:14px;background:#1f6b3a;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}#err{color:#9e332c;font-size:12px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
<div class="box"><div style="font-size:44px">🐦</div><h1>PuyuhKu</h1><p>Laporan keuangan peternakan puyuh</p>
<button id="go">Masuk dengan Google</button><div id="err"></div></div>
<script type="module">
import {configured,sb} from "./supabase.js";
const err=document.getElementById("err"),btn=document.getElementById("go"),app=new URL("aplikasi.html",location.href).href;
if(!configured){err.textContent="Isi SUPABASE_URL di supabase.js terlebih dahulu.";btn.disabled=true}
else{
 sb.auth.getSession().then(({data})=>{if(data.session)location.replace(app)});
 sb.auth.onAuthStateChange((_e,s)=>{if(s)location.replace(app)});
 btn.onclick=async()=>{btn.disabled=true;const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:app}});if(error){err.textContent=error.message;btn.disabled=false}};
}
</script>
</body></html>
